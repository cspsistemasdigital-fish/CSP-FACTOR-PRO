services:
  - type: web
    name: factor-pro
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrador
      - key: FRONTEND_BASE_URL
        value: https://factor-pro.onrender.com
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: EXPOSE_RESET_TOKEN
        value: "false"
      - key: UPLOAD_FOLDER
        value: /tmp/factorpro-uploads
      - key: BACKUP_FOLDER
        value: /tmp/factorpro-backups
      - key: BACKUP_SCHEDULER_ENABLED
        value: "false"
